name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: format:check
        run: pnpm format:check
      - name: lint
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck
      - name: test:ci
        if: ${{ !cancelled() }}
        run: pnpm test:ci
      - name: bundle:check
        if: ${{ !cancelled() }}
        run: pnpm bundle:check
