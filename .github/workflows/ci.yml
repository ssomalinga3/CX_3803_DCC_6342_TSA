name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Worker types
        run: pnpm --dir backend cf:typegen
      - name: format:check
        run: pnpm format:check
      - name: lint
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck
      - name: test:ci
        if: ${{ !cancelled() }}
        run: pnpm test:ci
      - name: bundle:check
        if: ${{ !cancelled() }}
        run: pnpm bundle:check

  backend-local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set up local PostGIS and apply Drizzle migrations
        run: pnpm backend:setup
      - name: Verify migration replay
        run: pnpm --dir backend db:migrate
      - name: Seed synthetic demo GIS (twice to verify repeatability)
        run: pnpm --dir backend db:seed && pnpm --dir backend db:seed
      - name: Jest integration against PostGIS
        run: pnpm --dir backend test:integration
      - name: Build and test the Worker against PostGIS
        run: pnpm backend:check
      - name: Database diagnostics
        if: failure()
        run: docker compose -f backend/docker-compose.yml logs db
      - name: Stop local database
        if: always()
        run: pnpm --dir backend db:down
